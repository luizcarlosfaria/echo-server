# Incluído dentro do bloco http {} do nginx (conf.d/default.conf).
# Necessário para o WebSocket do painel (<ECHO_DASHBOARD_PATH>/ws, padrão /_echo/ws): repassa o Upgrade e fecha conexões normais.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {

        listen 80;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        location / {
            proxy_pass         http://echo:80;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Painel mantém o WebSocket aberto indefinidamente (há keep-alive a cada 30s).
            proxy_read_timeout 1h;
        }


        #ACME-challenge
        location ^~ /.well-known/acme-challenge/ {
	        root /cert;
        }

    }
